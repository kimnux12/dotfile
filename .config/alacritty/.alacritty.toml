import = [
    "~/.config/alacritty/themes/themes/dracula.toml"
]
[shell]
args = ['--login']
program = "/usr/bin/bash"

[font]
size = 15.0

[font.bold]
family = "monospace"
style = "Bold"

[font.bold_italic]
family = "monospace"
style = "Bold Italic"

[font.italic]
family = "monospace"
style = "Italic"

[font.normal]
family = "monospace"
style = "Regular"

[keyboard]
bindings = [
   { key = "Return", mods = "Control|Shift", action = "SpawnNewInstance" }
]

[window]
startup_mode = "Windowed"
dynamic_padding = true
opacity = 0.8
